name: Weekly live CMS check

# Runs scripts/live-smoke.mjs against the real data.cms.gov API every week, so
# CMS-side drift (catalog format, dataset titles, column names, stale fallback
# IDs, an out-of-date ICD-10-PCS crosswalk) is reported as a GitHub issue
# instead of being discovered by a user. Not part of deploy: a CMS outage
# shouldn't block publishing.
#
# One open issue (label: live-cms-check) at a time: a new failure comments on
# it, and the next green run closes it.

on:
  schedule:
    - cron: '17 13 * * 1' # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run live CMS checks
        id: smoke
        run: |
          set +e
          node scripts/live-smoke.mjs 2>&1 | tee smoke-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open, update, or close the alert issue
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const label = 'live-cms-check';
            const code = Number(process.env.EXIT_CODE);
            const output = fs.readFileSync('smoke-output.txt', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Keep the issue readable: the ✗ lines first, full log collapsed.
            const failed = output.split('\n').filter(l => /^\s*✗/.test(l)).join('\n');
            const tail = output.length > 60000 ? output.slice(-60000) : output;
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            });
            const existing = open[0];

            if (code === 0) {
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number,
                  body: `✅ The live CMS check passed again ([run](${runUrl})). Closing.${footer}` });
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }

            // Exit 2 = the runner couldn't reach data.cms.gov at all, a
            // network problem rather than drift in CMS's data.
            const summary = code === 2
              ? 'The runner could not reach data.cms.gov, so nothing was checked. If this repeats, GitHub-hosted runners may be blocked from CMS and this check needs another home.'
              : 'Something the app depends on no longer matches what CMS serves. Each ✗ line says what changed and what to update.';
            const body =
              `${summary}\n\n**Run:** ${runUrl}\n\n` +
              (failed ? `**Failed checks**\n\`\`\`\n${failed}\n\`\`\`\n\n` : '') +
              `<details><summary>Full output</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n</details>${footer}`;

            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label });
              } catch (e) {
                await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b',
                  description: 'Opened by the weekly live CMS check workflow' });
              }
              await github.rest.issues.create({ ...context.repo, labels: [label],
                title: code === 2 ? 'Weekly live CMS check could not reach data.cms.gov' : 'Weekly live CMS check failed',
                body });
            }
            core.setFailed(code === 2 ? 'data.cms.gov unreachable' : 'live CMS check failed');
